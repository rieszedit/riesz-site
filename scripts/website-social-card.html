<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Riesz Website Social Card</title>
    <link rel="stylesheet" href="/node_modules/@fontsource/archivo/900.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-jp/700.css" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body { background: #1d1d1d; color: #f2f2f2; font-family: "Noto Sans JP", sans-serif; }
      main { width: 1200px; height: 630px; position: relative; padding: 54px 56px; }
      .label { color: #c6ff59; font-family: Archivo, sans-serif; font-size: 22px; margin: 0 0 22px; }
      .brand { font-family: Archivo, sans-serif; font-weight: 900; font-size: 100px; margin: 0 0 20px; line-height: 1; }
      h1 { font-size: 48px; font-weight: 700; line-height: 1.3; margin: 0 0 28px; }
      .rule { width: 64px; height: 5px; background: #c6ff59; margin-bottom: 25px; }
      .services { font-size: 22px; line-height: 1.9; margin: 0; color: #d2d2d2; }
      footer { position: absolute; bottom: 48px; left: 56px; font-size: 22px; }
      footer strong { color: #c6ff59; display: block; margin-bottom: 12px; }
      figure { position: absolute; width: 430px; margin: 0; background: #f2f2f2; border: 1px solid #626262; }
      figure img { display: block; width: 100%; height: auto; }
      .first { top: 34px; right: 36px; }
      .second { bottom: 34px; right: 100px; }
    </style>
  </head>
  <body>
    <main>
      <p class="label">WEBSITE DESIGN</p>
      <p class="brand">Riesz</p>
      <h1>Webサイト制作</h1>
      <div class="rule"></div>
      <p class="services">ポートフォリオ・店舗／企業サイト<br />LP・リニューアル</p>
      <footer><strong>個別お見積もり</strong>riesz.org/website</footer>
      <figure class="first"><img src="/media/web-utsumi.jpg" alt="慈（Utsumi）のWebサイト制作実績" /></figure>
      <figure class="second"><img src="/media/web-yakihoko.jpg" alt="YAKIHOKOのWebサイト制作実績" /></figure>
    </main>
  </body>
</html>
